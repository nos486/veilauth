name: Release

on:
  push:
    tags: ["v*"]
  # Redeploy production from main without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping production deploy."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile && pnpm build && pnpm test
      - name: Configure Turnstile
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        # Production refuses sign-ups without Turnstile (docs/DECISIONS.md D-033). See SELF_HOSTING.md section C.
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::Set the TURNSTILE_SITE_KEY variable and the TURNSTILE_SECRET_KEY secret (docs/SELF_HOSTING.md, section C)."
            exit 1
          fi
          if grep -q REPLACE_WITH_TURNSTILE_SITE_KEY wrangler.jsonc; then
            sed -i "s/REPLACE_WITH_TURNSTILE_SITE_KEY/${TURNSTILE_SITE_KEY}/" wrangler.jsonc
          fi
      - name: Resolve D1 database id
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        # Creates veilauth-production on first deploy and fills its id into wrangler.jsonc (CI copy only).
        run: node scripts/setup-cloudflare.mjs production
      - name: Migrate D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        run: pnpm db:migrate:production
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        run: pnpm deploy:production
      - name: Create missing secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        # First deploy only: generates JWT/HMAC keys inside Cloudflare; existing secrets are never replaced.
        run: node scripts/generate-secrets.mjs --env production --missing-only
      - name: Set the Turnstile secret
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        run: printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --env production
      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != '' && env.PRODUCTION_URL != ''
        run: scripts/smoke-test.sh "$PRODUCTION_URL"

  android-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      built: ${{ steps.check.outputs.built }}
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VEILAUTH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VEILAUTH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      VEILAUTH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VEILAUTH_API_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check signing setup
        id: check
        # The release key signs every future update (D-019); see docs/SELF_HOSTING.md, section D.
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$VEILAUTH_KEYSTORE_PASSWORD" ] || [ -z "$VEILAUTH_KEY_ALIAS" ] || [ -z "$VEILAUTH_KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are not set; this release has no APK (docs/SELF_HOSTING.md, section D)."
            echo "built=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$VEILAUTH_API_URL" ]; then
            echo "::warning::The PRODUCTION_URL variable is not set, so the app would not know its server; this release has no APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.built == 'true'
      - uses: actions/setup-java@v5
        if: steps.check.outputs.built == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        if: steps.check.outputs.built == 'true'
      - name: Version and keystore
        if: steps.check.outputs.built == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${v%%-*}"
          echo "VEILAUTH_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "VEILAUTH_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VEILAUTH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APKs and AAB
        if: steps.check.outputs.built == 'true'
        run: apps/android/scripts/gradle-ci.sh test :app:assembleGithubRelease :app:bundleGithubRelease :app:assembleFdroidRelease
      - name: Collect, hash and describe
        if: steps.check.outputs.built == 'true'
        run: |
          v="$VEILAUTH_VERSION_NAME"
          out=apps/android/app/build/outputs
          mkdir -p android
          cp "$out/apk/github/release/app-github-release.apk" "android/veilauth-$v.apk"
          cp "$out/apk/fdroid/release/app-fdroid-release.apk" "android/veilauth-$v-fdroid.apk"
          cp "$out/bundle/githubRelease/app-github-release.aab" "android/veilauth-$v.aab"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "android/veilauth-$v.apk" | grep -i "SHA-256" > android/android-signing-cert.txt
          sha=$(sha256sum "android/veilauth-$v.apk" | cut -d' ' -f1)
          printf '{"versionName":"%s","versionCode":%s,"apk":"veilauth-%s.apk","sha256":"%s"}\n' \
            "$v" "$VEILAUTH_VERSION_CODE" "$v" "$sha" > android/android-update.json
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.built == 'true'
        with:
          name: android
          path: android
          retention-days: 7

  github-release:
    needs: [deploy-production, android-release]
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.deploy-production.result == 'success' && needs.android-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Collect artifacts
        run: |
          mkdir -p release
          (cd apps/worker && npx wrangler deploy --dry-run --env production --outdir ../../release/worker-bundle >/dev/null)
          tar -C apps/web -czf release/web-assets.tar.gz dist
          cp apps/web/dist/SHA256SUMS release/web-SHA256SUMS
          tar -C release -czf release/worker-bundle.tar.gz worker-bundle && rm -rf release/worker-bundle
          cp spec/api.openapi.yaml spec/test-vectors.json release/
      - uses: actions/download-artifact@v4
        if: needs.android-release.outputs.built == 'true'
        with:
          name: android
          path: release
      - name: Hash everything
        run: (cd release && sha256sum * > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built by GitHub Actions from ${GITHUB_SHA}."
            echo
            echo "### SHA-256"
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            if [ -f release/android-signing-cert.txt ]; then
              echo "### Android signing certificate"
              echo '```'
              cat release/android-signing-cert.txt
              echo '```'
              echo
            fi
            echo "### Web app files (compare with what your browser is served)"
            echo '```'
            cat release/web-SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
