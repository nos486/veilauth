name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Test vectors are up to date
        run: pnpm vectors:check
      - run: pnpm format:check
      - name: OpenAPI spec is up to date
        run: pnpm --filter @zk2fa/shared openapi:check
      - name: Kotlin API models are up to date
        run: pnpm --filter @zk2fa/shared kotlin:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Web E2E (Playwright + local Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @zk2fa/web exec playwright install --with-deps chromium
      - name: Sign up → QR → second browser → password change → D1 audit
        run: pnpm --filter @zk2fa/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  android:
    name: Android (Kotlin core vectors + app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Kotlin core modules against spec/test-vectors.json
        run: apps/android/scripts/gradle-ci.sh -Pveilauth.coreOnly=true test
      - name: App unit tests, debug APKs and lint
        run: apps/android/scripts/gradle-ci.sh :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleFdroidDebug :app:lintGithubDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/**/build/reports/tests
            apps/android/app/build/reports/lint-results-*.html
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
